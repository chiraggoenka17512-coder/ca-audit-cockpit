name: "ReconOS Autonomous Cloud Agent"

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Task instructions for the agent"
        required: true
        default: "Implement Step 2: Encrypted SQLite storage with AES-256-GCM"
      agent_role:
        description: "Agent role (Rust Core / Parsers / UI)"
        required: false
        default: "Rust Core & Security Lead"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-agent:
    name: "Autonomous Coding Agent"
    # Run only on issues/comments directed to the agent or workflow dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'agent') || contains(github.event.issue.title, '[Agent'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/run'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Parse Trigger Context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task_prompt=${{ github.event.inputs.task_prompt }}" >> $GITHUB_OUTPUT
            echo "agent_role=${{ github.event.inputs.agent_role }}" >> $GITHUB_OUTPUT
            echo "issue_number=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "task_prompt=${{ github.event.issue.title }} - ${{ github.event.issue.body }}" >> $GITHUB_OUTPUT
            echo "agent_role=Auto-Assigned Lead" >> $GITHUB_OUTPUT
            echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "task_prompt=${{ github.event.comment.body }} (Context: ${{ github.event.issue.title }})" >> $GITHUB_OUTPUT
            echo "agent_role=Auto-Assigned Lead" >> $GITHUB_OUTPUT
            echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Cloud Agent Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_PROMPT: ${{ steps.context.outputs.task_prompt }}
          AGENT_ROLE: ${{ steps.context.outputs.agent_role }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
        run: |
          python3 .github/scripts/remote_agent.py
